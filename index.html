<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Road to C1</title>
<meta name="description" content="A 10-month plan from B2 to C1 with a focus on fluent American English speaking.">
<meta name="theme-color" content="#4f46e5">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Road to C1">
<style>
:root {
  --bg: #f6f7fb; --surface: #ffffff; --surface-2: #f1f3f9; --border: #e3e6ef;
  --text: #171a26; --muted: #646b80; --accent: #4f46e5; --accent-2: #0ea5e9; --accent-soft: #eef0ff;
  --ok: #16a34a; --ok-soft: #e8f7ee; --warn: #d97706; --danger: #dc2626;
  --c-listening: #2563eb; --c-speaking: #c026d3; --c-reading: #059669; --c-writing: #ea580c; --c-vocab: #0891b2;
  --radius: 14px; --shadow: 0 1px 2px rgba(16,24,40,.05), 0 2px 8px rgba(16,24,40,.04);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1018; --surface: #171a25; --surface-2: #1f2331; --border: #2a2f40;
    --text: #e9ebf3; --muted: #9aa1b5; --accent: #8b85ff; --accent-2: #38bdf8; --accent-soft: #24264a;
    --ok: #4ade80; --ok-soft: #173325; --warn: #fbbf24; --danger: #f87171;
    --c-listening: #60a5fa; --c-speaking: #e879f9; --c-reading: #34d399; --c-writing: #fb923c; --c-vocab: #22d3ee;
    --shadow: none; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1018; --surface: #171a25; --surface-2: #1f2331; --border: #2a2f40;
  --text: #e9ebf3; --muted: #9aa1b5; --accent: #8b85ff; --accent-2: #38bdf8; --accent-soft: #24264a;
  --ok: #4ade80; --ok-soft: #173325; --warn: #fbbf24; --danger: #f87171;
  --c-listening: #60a5fa; --c-speaking: #e879f9; --c-reading: #34d399; --c-writing: #fb923c; --c-vocab: #22d3ee;
  --shadow: none; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--text);
  font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
}
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent); }
h1, h2, h3, h4 { margin: 0 0 .5rem; line-height: 1.25; }
h1 { font-size: 1.55rem; letter-spacing: -.01em; }
h2 { font-size: 1.15rem; }
h3 { font-size: 1rem; }
p { margin: 0 0 .75rem; }
.muted { color: var(--muted); }
.small { font-size: .85rem; }

/* Layout */
.app { display: grid; grid-template-columns: 232px 1fr; min-height: 100vh; }
.sidebar {
  position: sticky; top: 0; height: 100vh; overflow-y: auto;
  background: var(--surface); border-right: 1px solid var(--border); padding: 18px 12px;
}
.brand { display: flex; align-items: center; gap: 10px; padding: 4px 8px 18px; font-weight: 700; font-size: 1.05rem; }
.brand img { width: 32px; height: 32px; border-radius: 8px; }
.nav a {
  display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 10px;
  color: var(--text); text-decoration: none; font-weight: 500; margin-bottom: 2px;
}
.nav a:hover { background: var(--surface-2); }
.nav a.active { background: var(--accent-soft); color: var(--accent); }
.nav svg { width: 19px; height: 19px; flex: none; }
.main { padding: 28px clamp(16px, 4vw, 40px) 100px; max-width: 1080px; width: 100%; }
.page-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
.page-head p { margin: 0; }

@media (max-width: 820px) {
  .app { grid-template-columns: 1fr; }
  .sidebar {
    position: fixed; top: auto; bottom: 0; left: 0; right: 0; height: auto; z-index: 20;
    border-right: 0; border-top: 1px solid var(--border); padding: 6px 6px calc(6px + env(safe-area-inset-bottom));
  }
  .brand { display: none; }
  .nav { display: flex; overflow-x: auto; gap: 2px; scrollbar-width: none; }
  .nav::-webkit-scrollbar { display: none; }
  .nav a { flex-direction: column; gap: 2px; font-size: .68rem; padding: 6px 8px; min-width: 62px; margin: 0; }
  .main { padding-top: 18px; padding-bottom: 110px; }
}

/* Components */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; box-shadow: var(--shadow); margin-bottom: 16px; }
.card > h2:first-child, .card > h3:first-child { margin-bottom: .75rem; }
.grid { display: grid; gap: 16px; }
.grid-2 { grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }
.grid-3 { grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
.grid-4 { grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
.grid > .card { margin-bottom: 0; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.spacer { flex: 1; }
.stack > * + * { margin-top: 10px; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  border: 1px solid var(--border); background: var(--surface); color: var(--text);
  padding: 8px 14px; border-radius: 10px; cursor: pointer; font-weight: 600; font-size: .9rem;
  min-height: 38px; transition: background .15s, border-color .15s;
}
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { color: var(--danger); }
.btn.rec { background: var(--danger); border-color: var(--danger); color: #fff; }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.sm { padding: 4px 10px; min-height: 30px; font-size: .82rem; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn svg { width: 16px; height: 16px; }

.chip { display: inline-flex; align-items: center; gap: 4px; padding: 2px 9px; border-radius: 999px; font-size: .75rem; font-weight: 600; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
.chip.listening { color: var(--c-listening); } .chip.speaking { color: var(--c-speaking); }
.chip.reading { color: var(--c-reading); } .chip.writing { color: var(--c-writing); } .chip.vocab { color: var(--c-vocab); }
.dot { width: 10px; height: 10px; border-radius: 3px; display: inline-block; flex: none; }

.seg { display: inline-flex; background: var(--surface-2); border-radius: 10px; padding: 3px; gap: 2px; flex-wrap: wrap; }
.seg button { border: 0; background: transparent; padding: 6px 12px; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: .85rem; color: var(--muted); }
.seg button.on { background: var(--surface); color: var(--text); box-shadow: var(--shadow); }

input[type=text], input[type=number], input[type=date], input[type=month], select, textarea {
  background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 8px 10px; width: 100%; min-height: 38px;
}
textarea { resize: vertical; line-height: 1.6; }
input:focus, select:focus, textarea:focus, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
label.field { display: block; font-size: .82rem; font-weight: 600; color: var(--muted); }
label.field > input, label.field > select, label.field > textarea { margin-top: 4px; color: var(--text); font-weight: 400; }
.form-grid { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); align-items: end; }

.progress { height: 8px; background: var(--surface-2); border-radius: 999px; overflow: hidden; }
.progress > div { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent-2)); border-radius: 999px; transition: width .3s; }

.stat .num { font-size: 1.8rem; font-weight: 750; letter-spacing: -.02em; line-height: 1.1; font-variant-numeric: tabular-nums; }
.stat .lbl { color: var(--muted); font-size: .82rem; font-weight: 600; }

/* Checklist */
.task { display: flex; gap: 12px; align-items: flex-start; padding: 12px; border: 1px solid var(--border); border-radius: 12px; margin-bottom: 8px; background: var(--surface); }
.task.done { background: var(--ok-soft); border-color: transparent; }
.task.done .task-title { text-decoration: line-through; color: var(--muted); }
.check { appearance: none; width: 24px; height: 24px; border: 2px solid var(--border); border-radius: 7px; flex: none; cursor: pointer; margin-top: 1px; display: grid; place-content: center; background: var(--surface); }
.check:checked { background: var(--ok); border-color: var(--ok); }
.check:checked::after { content: ""; width: 6px; height: 11px; border: solid #fff; border-width: 0 2.5px 2.5px 0; transform: rotate(45deg) translate(-1px, -1px); }
.task-title { font-weight: 600; }
.task-body { flex: 1; min-width: 0; }

/* Lists */
.list { list-style: none; margin: 0; padding: 0; }
.list li { padding: 10px 0; border-bottom: 1px solid var(--border); display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.list li:last-child { border-bottom: 0; }

/* Roadmap */
.phase-bar { display: flex; height: 14px; border-radius: 999px; overflow: hidden; background: var(--surface-2); }
.weeks { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 10px; }
.week { border: 1px solid var(--border); border-radius: 12px; padding: 12px; background: var(--surface); position: relative; }
.week.current { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
.week.complete { background: var(--ok-soft); border-color: transparent; }
.week h4 { margin: 0 0 6px; font-size: .95rem; }
.week ul { margin: 0; padding-left: 18px; font-size: .85rem; color: var(--muted); }

/* Speaking */
.prompt-box { font-size: 1.2rem; font-weight: 600; line-height: 1.45; }
.timer { font-size: 3rem; font-weight: 750; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.timer-phase { font-weight: 700; text-transform: uppercase; letter-spacing: .06em; font-size: .78rem; color: var(--muted); }
.flash { animation: flash 1s ease 2; }
@keyframes flash { 50% { background: var(--accent-soft); } }
audio { width: 100%; max-width: 360px; height: 36px; }

/* Vocab card */
.flash-card { text-align: center; padding: 34px 20px; }
.flash-card .term { font-size: 1.7rem; font-weight: 750; }
.rate-btns { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.rate-btns .btn { flex-direction: column; gap: 0; }
.rate-btns small { font-weight: 500; color: var(--muted); font-size: .72rem; }

/* Tables */
table.data { border-collapse: collapse; width: 100%; font-size: .9rem; }
table.data th, table.data td { border: 1px solid var(--border); padding: 6px 10px; text-align: left; }
table.data th { background: var(--surface-2); }
.table-wrap { overflow-x: auto; }

.toast { position: fixed; left: 50%; bottom: 96px; transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-weight: 600; z-index: 50; opacity: 0; transition: opacity .2s; pointer-events: none; }
.toast.show { opacity: 1; }
.empty { text-align: center; color: var(--muted); padding: 24px 10px; }
details summary { cursor: pointer; font-weight: 600; }
.chart { width: 100%; height: auto; display: block; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: .82rem; color: var(--muted); margin-top: 8px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.banner { background: var(--accent-soft); border-radius: 12px; padding: 12px 14px; margin-bottom: 16px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.hidden { display: none !important; }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand"><img src="icons/icon-192.png" alt="">Road to C1</div>
    <nav class="nav" id="nav"></nav>
  </aside>
  <main class="main" id="view" tabindex="-1"></main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
